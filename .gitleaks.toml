# 5-3 저장소 시크릿 스캔 설정 (gitleaks v8.19 이상)
#   gitleaks git -v --redact .        # 이력 전체
#   gitleaks dir -v --redact .        # 지금 파일만 (git 저장소가 아니어도)
# 기본 규칙(AWS 키 · 개인 키 · 토큰 형식 …)을 그대로 쓰고, 실습용 "가짜 값"만 허용 목록에 둔다.
title = "backend-security-lab"

[extend]
useDefault = true

[[allowlists]]
description = "실습용 가짜 값 (EXAMPLE · lab-only · 테스트 고정값) — 진짜 비밀은 이 이름을 쓰지 않는다"
regexTarget = "line"
regexes = [
  '''(?i)EXAMPLE''',
  '''lab-only''',
  '''-lab-pass''',
  '''whsec_TEST_ONLY''',
]

[[allowlists]]
description = "의존성·빌드 산출물 (스캔 대상 아님)"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)package-lock\.json$''',
]
