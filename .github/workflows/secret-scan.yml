# 5-3 푸시·PR 마다 저장소 이력 전체를 gitleaks 로 검사한다 (.gitleaks.toml 사용)
# 푸시 보호(GitHub push protection)와 커밋 전 검사(.pre-commit-config.yaml)를 통과해 들어온 것까지 잡는다.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0          # 이력 전체
          persist-credentials: false
      - name: gitleaks (이력 전체)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git -v --redact --config .gitleaks.toml --exit-code 1 .
