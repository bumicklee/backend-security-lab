# 6-4 릴리스: 커밋 SHA 고정 · 최소 권한 · OIDC(장기 키 없음) · SBOM · 서명(키리스) · SLSA 출처 증명.
# 배포 전에는 서명과 출처를 검증한다(cosign verify · gh attestation verify — README "6-4" 참고).
# 외부 PR 용 트리거(pull_request_target)는 쓰지 않는다. 비밀이 있는 작업에서 PR 코드를 실행하지 않는다.
name: release

on: { push: { branches: [main] } }

permissions: { contents: read }                       # 기본은 읽기만

concurrency: { group: release, cancel-in-progress: false }

jobs:
  release:
    # 실습 저장소: 저장소 변수 ENABLE_RELEASE=true 일 때만 실행 (예시 값으로는 실패하므로 기본은 꺼 둠)
    if: vars.ENABLE_RELEASE == 'true'
    runs-on: ubuntu-24.04
    # 이 작업에만: OIDC 토큰(AWS 역할·키리스 서명), 이미지 푸시, 출처 증명 기록
    permissions: { contents: read, id-token: write, packages: write, attestations: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}   # 예: arn:aws:iam::111122223333:role/board-release (장기 키 없음)
          aws-region: ap-northeast-2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 24 }
      - name: 테스트 (잠금 파일 그대로, 설치 스크립트 끔)
        working-directory: node
        run: |
          npm ci --ignore-scripts
          npx --no-install prisma generate    # 끈 postinstall 중 꼭 필요한 것만 직접 실행
          npm test

      - name: 이미지 이름 (GHCR 은 소문자만)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/board-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: node
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # SBOM: 이미지에 들어간 재료 목록 (CycloneDX). 릴리스마다 만들어 보관한다
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
      - name: SBOM 보관 (릴리스별)
        run: aws s3 cp "sbom-${GITHUB_SHA}.cdx.json" "s3://${{ vars.SBOM_BUCKET }}/board-api/"

      # 서명: 키를 보관하지 않는다. CI 의 OIDC 신원으로 서명하고 기록은 투명성 로그에 남는다
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 서명과 SBOM 증명 (키리스)
        env: { REF: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" }
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate "sbom-${GITHUB_SHA}.cdx.json" "$REF"
      # SLSA 출처 증명: 어떤 커밋을 어떤 워크플로가 빌드했나
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
