# 5-3 CI 도 장기 키 없이: OIDC 단기 자격 증명 (예시 — 실제 배포 단계는 서비스에 맞게)
# 사용하려면 .github/workflows/ 로 옮기고, 저장소 변수 DEPLOY_ROLE_ARN 을 만든다.
# AWS 쪽 역할 신뢰 정책에는 꼭 저장소·브랜치 조건을 건다:
#   "token.actions.githubusercontent.com:sub": "repo:<org>/<repo>:ref:refs/heads/main"
#   "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write        # 실행마다 OIDC 토큰 발급
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}   # 키가 아니라 역할 이름
          aws-region: ap-northeast-2
      - name: 배포 (예시)
        run: aws sts get-caller-identity   # 여기서 실제 배포 명령을 실행한다
