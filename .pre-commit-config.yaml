# 5-3 커밋 전 검사: 키처럼 생긴 문자열이 스테이징되면 커밋을 막는다
#   pip install pre-commit && pre-commit install
#   (훅 설치 후) git commit → "Detect hardcoded secrets ... Failed" 이면 그 값을 빼고 다시 커밋
# 버전은 태그 대신 커밋 SHA 로 고정해도 된다: pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
