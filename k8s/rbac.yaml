# 6-6 RBAC 최소 권한: 앱 전용 서비스 계정 + 네임스페이스 안에서만 유효한 Role(설정 맵 하나, 읽기만).
# 기본 서비스 계정(default)에는 아무 권한도 붙이지 않는다. ClusterRole·cluster-admin 은 쓰지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata: { name: board-api, namespace: board }
automountServiceAccountToken: false                # API 를 쓰지 않는 앱은 토큰도 없이
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                                         # 네임스페이스 안에서만 유효
metadata: { name: board-api, namespace: board }
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [board-config]                  # 이 설정 하나만
    verbs: [get, watch]                            # 읽기만
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: board-api, namespace: board }
subjects: [{ kind: ServiceAccount, name: board-api, namespace: board }]
roleRef: { kind: Role, name: board-api, apiGroup: rbac.authorization.k8s.io }
