# 6-2 앱이 남긴 보안 이벤트(security.log)를 fail2ban 이 읽는다.
# 설치: sudo cp filter.d/board-security.conf /etc/fail2ban/filter.d/
# 줄 예시(한 줄에 JSON, 첫 필드가 ISO 8601 UTC 시각 "ts"):
#   {"ts":"2026-10-20T05:12:40Z","event":"authz_denied","user":"bob","ip":"203.0.113.77","path":"/admin/ping"}
# 확인: fail2ban-regex /var/log/board/security.log /etc/fail2ban/filter.d/board-security.conf
[Definition]
# 인가 실패·입력 검증 거부만 센다. 대량 조회(bulk_lookup·bulk_block)는 계정 단위라 앱이 직접 막는다.
failregex = "event":"(authz_denied|validation_reject)".*"ip":"<HOST>"
ignoreregex =
# 시각을 찾지 못하면 줄이 매칭되지 않는다. 기본 감지도 ISO 8601 을 찾지만 운영에서는 명시해 둔다.
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:%%z)?"
